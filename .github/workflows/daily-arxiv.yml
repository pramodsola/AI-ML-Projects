name: Daily arXiv digest

on:
  schedule:
    - cron: '0 7 * * *'   # 7:00 AM UTC every day
  workflow_dispatch:        # allow manual run from Actions tab

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arxiv package
        run: pip install arxiv

      - name: Fetch and write arXiv digest
        run: |
          mkdir -p arxiv-daily
          python - <<'EOF'
          import arxiv
          from datetime import datetime, timezone

          client = arxiv.Client(num_retries=3, delay_seconds=3)
          search = arxiv.Search(
            query="cat:cs.LG OR cat:cs.AI OR cat:cs.CL OR cat:cs.CV",
            max_results=7,
            sort_by=arxiv.SortCriterion.SubmittedDate,
            sort_order=arxiv.SortOrder.Descending,
          )

          results = list(client.results(search))
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')

          lines = [
            f"# arXiv Daily Digest — {today}",
            "",
            "_Top papers in Machine Learning · AI · NLP · Computer Vision_",
            "",
            "---",
            "",
          ]

          for i, paper in enumerate(results, 1):
            title   = paper.title.replace('\n', ' ')
            summary = paper.summary.replace('\n', ' ')
            authors = ', '.join(a.name for a in paper.authors[:3])
            cats    = ', '.join(paper.categories[:3])
            link    = paper.entry_id

            lines += [
              f"## {i}. {title}",
              f"**Authors:** {authors}",
              f"**Categories:** {cats}",
              f"**Abstract:** {summary[:400]}{'...' if len(summary) > 400 else ''}",
              f"**Link:** {link}",
              "",
              "---",
              "",
            ]

          out_path = f"arxiv-daily/{today}.md"
          with open(out_path, 'w', encoding='utf-8') as f:
            f.write('\n'.join(lines))
          print(f"Written {out_path} with {len(results)} papers")
          EOF

      - name: Commit digest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add arxiv-daily/
          git diff --cached --quiet || git commit -m "Daily arXiv digest: $(date -u +%Y-%m-%d)"
          git push
